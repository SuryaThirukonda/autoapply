<!doctype html>
<html><head><meta charset="utf-8"><title>Workday password reset (fixture)</title></head>
<body>
<!-- Micron's Workday reset page (2026-10-23): 'Password' and 'Verify New Password'. The verify box holds a retype appended
     to a partial first one (13 characters to the password's 10). The values are test strings, never a real password. -->
<form>
  <label for="input-4">Password*</label>
  <input id="input-4" type="password" data-automation-id="password" data-goat-ref="e2" value="Abcdefgh1!">
  <label for="input-5">Verify New Password*</label>
  <input id="input-5" type="password" data-automation-id="verifyPassword" data-goat-ref="e3" value="AbcAbcdefgh1!">
  <button type="button" data-goat-ref="e4">Submit</button>
</form>
<script>
  // a React-like form that only counts a value it saw through an input event
  window.__seen = {};
  for (const el of document.querySelectorAll('input')) el.addEventListener('input', () => { window.__seen[el.id] = el.value.length; });
</script>
</body></html>
