<!doctype html>
<html><head><meta charset="utf-8"><title>Career Opportunities: Sign In</title></head>
<body>
<!-- PACCAR's SuccessFactors sign-in page (2026-10-23): its 'Forgot your password?' link is no reset form to send. -->
<h1>Career Opportunities: Sign In</h1>
<h2>Already have an account?</h2>
<form onsubmit="event.preventDefault();">
  <label for="email">Email Address:*</label>
  <input id="email" type="text" maxlength="99" required>
  <label for="pw">Password:*</label>
  <input id="pw" type="password" required>
  <button type="submit">Sign In</button>
  <a href="#forgot">Forgot your password?</a>
</form>
<h2>Not a registered user yet?</h2>
<a href="#create">Create an account</a>
</body></html>
