<!doctype html>
<html><head><meta charset="utf-8"><title>Career Opportunities: Password Help</title></head>
<body>
<!-- PACCAR's SuccessFactors 'Password Help' page (2026-10-23), the form opened by 'Forgot your password?'. Nothing is
     emailed until Submit is clicked. -->
<h1>Career Opportunities: Password Help</h1>
<p>Please identify your account, and we will email you a link to reset your password.</p>
<p>*indicates a required field.</p>
<form onsubmit="event.preventDefault(); document.getElementById('sent').hidden = false; this.hidden = true;">
  <label for="email">Email Address:*</label>
  <input id="email" type="text" maxlength="99" required>
  <button type="submit" id="send">Submit</button>
  <button type="button" id="cancel">Cancel</button>
</form>
<p id="sent" hidden>An email with a link to reset your password has been sent.</p>
</body></html>
