<!doctype html>
<html><head><meta charset="utf-8"><title>Greenhouse labels (fixture)</title></head>
<body>
<!-- Ivalua's Greenhouse form (2026-10-22): a required textarea whose own label (label for=) sits apart from its wrapper,
     after another field's label in the same container. The page-error scan named it 'LinkedIn Profile'. -->
<form>
  <div class="application--questions">
    <label for="question_linkedin">LinkedIn Profile</label>
    <input id="question_linkedin" type="text" value="https://www.linkedin.com/in/surya-thirukonda">
    <label for="question_basis">If YES to requiring support: What is the basis of your current work authorization?<span>*</span></label>
    <div class="text-area-wrapper"><textarea id="question_basis" required></textarea></div>
  </div>
</form>
</body></html>
